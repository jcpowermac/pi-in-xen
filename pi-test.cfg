# Pi Agent Xen PVH VM
# Simple test config for xl create

name = "pi-test"
type = "pvh"
memory = 1024
vcpus = 2

kernel = "/var/home/jcallen/Development/pi-in-xen/artifacts/pi-agent-xen-pvh/kernel/out/vmlinuz"
ramdisk = "/var/home/jcallen/Development/pi-in-xen/artifacts/pi-agent-xen-pvh/rootfs/out/initramfs.cpio.gz"

# Kernel command line
extra = "console=hvc0 root=/dev/ram0 init=/init"

# Console via hvc0
vconsole = [ "hvc" ]

# No persistent disk (initramfs only)

# Optional: network (PV ethernet)
# vif = [ "type=ioemu,bridge=xenbr0,mac=00:16:3e:00:00:01" ]
